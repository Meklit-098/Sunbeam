<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chapter Books</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #ffffff;
      color: #333333;
    }
    .book-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 15px;
    }
    .book-card {
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 10px;
      text-align: center;
      background-color: #f9f9f9;
    }
  </style>
</head>
<body>
  <h2>Chapter Books</h2>
  <div class="book-grid">
    <div class="book-card">
      <h3>Book Title 1</h3>
      <p>Author Name</p>
    </div>
    <div class="book-card">
      <h3>Book Title 2</h3>
      <p>Author Name</p>
    </div>
  </div>
</body>
</html>
