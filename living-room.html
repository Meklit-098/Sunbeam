<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial scale=1.0"/>
        <link rel="stylesheet" href="living-room.css">
        <script src="living-room.js" defer></script>
        <title>Saron and Meklit's Hearth</title>
    </head>
    <body>
        <!-- The trigger (word or image) -->
        <div id="library-trigger" style="cursor: pointer;">
            <p>📚 Open Window</p>
        </div>

        <div id="library-popup" class="hidden">
            <div class="popup-header" id="popup-header">
                <span>Desktop Window</span>
                <button id="close-popup">X</button>
            </div>
            
            <div class="tab-bar">
                <button class="tab-btn active" data-src="library.html">Library</button>
                <button class="tab-btn" data-src="music.html">Music</button>
            </div>

            <iframe id="window-frame" src="library.html"></iframe>
        </div>
    </body>
</html>
